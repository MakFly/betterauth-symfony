name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable stable SemVer tag to publish, for example v1.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: immutable-release
  cancel-in-progress: false

jobs:
  quality:
    name: Symfony quality matrix
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release-ready:
    name: Verify release request
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main, got: $GITHUB_REF" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable release version: $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Record validated release target
        run: |
          echo "## Release readiness verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "The protected administrator release process may now create the release and tag together." >> "$GITHUB_STEP_SUMMARY"
