name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symfony: ['6.4.*', '7.4.*', '8.0.*']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, openssl
          tools: composer:v2
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - run: composer validate --strict
      - name: Constrain direct Symfony dependencies
        run: |
          composer require --no-update \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/event-dispatcher:${{ matrix.symfony }}" \
            "symfony/framework-bundle:${{ matrix.symfony }}" \
            "symfony/http-foundation:${{ matrix.symfony }}" \
            "symfony/http-kernel:${{ matrix.symfony }}" \
            "symfony/security-bundle:${{ matrix.symfony }}" \
            "symfony/yaml:${{ matrix.symfony }}"
          composer require --dev --no-update \
            "symfony/browser-kit:${{ matrix.symfony }}" \
            "symfony/phpunit-bridge:${{ matrix.symfony }}"
      - run: composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress
      - name: Prove resolved Symfony version
        run: composer show symfony/framework-bundle --format=json
      - run: vendor/bin/phpunit
        env:
          # Matrix rows constrain direct components; Composer can still select a
          # newer optional Symfony component whose upstream deprecation is not
          # emitted by this bundle. Keep direct deprecations fatal.
          SYMFONY_DEPRECATIONS_HELPER: weak
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - run: composer audit --no-interaction --locked
